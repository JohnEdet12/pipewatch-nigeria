name: Sync NOSDRA and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Re-read the NOSDRA Oil Spill Monitor feed and rebuild data.json.
      # If NOSDRA is unreachable the last committed data.json is deployed unchanged.
      - name: Sync with NOSDRA
        continue-on-error: true
        run: python pipeline.py

      # Commit only when the spill records themselves changed (not just the sync time).
      # The freshly built data.json is deployed either way.
      - name: Commit refreshed data
        run: |
          ver() { python -c "import json,sys; print(json.load(sys.stdin)['meta']['version'])"; }
          if [ "$(git show HEAD:data.json | ver)" != "$(ver < data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Sync NOSDRA spill records"
            git push || echo "Push skipped: main moved during this run; the next sync will commit."
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
